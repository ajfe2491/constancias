services:
  app:
    build:
      context: .
      args:
        user: erick
        uid: 1000
    container_name: constancias-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - constancias-net
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      args:
        user: erick
        uid: 1000
    container_name: constancias-queue
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - constancias-net
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.27
    container_name: constancias-web
    restart: unless-stopped
    ports:
      - "8180:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - constancias-net
    depends_on:
      app:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: constancias-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - constancias-net

  db:
    image: mysql:8.0
    container_name: constancias-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: constancias
      MYSQL_USER: constancias
      MYSQL_PASSWORD: constancias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - constancias-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "constancias", "-pconstancias"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:


networks:
  constancias-net:
    driver: bridge
